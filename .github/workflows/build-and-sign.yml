name: build-and-sign

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install
        run: pip install -e ".[dev,package]"
      - name: Cache zig + SDL2
        uses: actions/cache@v4
        with:
          path: |
            C:\zig-sdk
            C:\sdl2-sdk
          key: c-toolchain-zig-0.16.0-sdl2-2.30.10-windows
      - name: Install zig + SDL2 (for the C backend tests)
        shell: pwsh
        run: |
          if (-not (Test-Path C:\zig-sdk\zig.exe)) {
            curl.exe -sSL -o $env:RUNNER_TEMP\zig.zip https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip
            New-Item -ItemType Directory -Path C:\zig-sdk | Out-Null
            tar -xf $env:RUNNER_TEMP\zig.zip -C C:\zig-sdk --strip-components=1
          }
          if (-not (Test-Path C:\sdl2-sdk\include)) {
            curl.exe -sSL -o $env:RUNNER_TEMP\sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-devel-2.30.10-mingw.tar.gz
            tar -xzf $env:RUNNER_TEMP\sdl2.tar.gz -C $env:RUNNER_TEMP
            New-Item -ItemType Directory -Path C:\sdl2-sdk | Out-Null
            Copy-Item -Recurse $env:RUNNER_TEMP\SDL2-devel-2.30.10-mingw\x86_64-w64-mingw32\* C:\sdl2-sdk\
          }
          echo "ZIG=C:\zig-sdk\zig.exe" >> $env:GITHUB_ENV
          echo "SDL2_HOME=C:\sdl2-sdk" >> $env:GITHUB_ENV
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Build GUI exe
        run: pyinstaller Sb3ConvGui.spec --noconfirm
      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: sb3conv-gui-unsigned-${{ github.run_id }}
          path: dist/sb3conv-gui.exe
          if-no-files-found: error

  godot-test:
    # the godot backend is only smoke-tested when a Godot editor is present
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install Godot
        run: |
          curl -sSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=${PWD}/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 \
            libxfixes3 libxrender1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libgl1 libasound2t64 libpulse0
      - name: Test (headless import + smoke)
        run: python -m pytest tests/test_godot.py -v

  sign:
    needs: build
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-artifact
      - name: Upload signed artifact
        uses: actions/upload-artifact@v7
        with:
          name: sb3conv-gui-signed-${{ github.run_id }}
          path: signed-artifact
          if-no-files-found: error
