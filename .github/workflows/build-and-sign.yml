name: build-and-sign

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install
        run: pip install -e ".[dev,package]"
      - name: Lint
        run: ruff check .
      - name: Test
        # test_c needs zig + SDL2 headers; re-enable once the runner has them
        run: python -m pytest --ignore=tests/test_c.py
      - name: Build GUI exe
        run: pyinstaller Sb3ConvGui.spec --noconfirm
      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: sb3conv-gui-unsigned-${{ github.run_id }}
          path: dist/sb3conv-gui.exe
          if-no-files-found: error

  godot-test:
    # the godot backend is only smoke-tested when a Godot editor is present
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install Godot
        run: |
          curl -sSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=${PWD}/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 \
            libxfixes3 libxrender1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libgl1 libasound2t64 libpulse0
      - name: Test (headless import + smoke)
        run: python -m pytest tests/test_godot.py -v

  sign:
    needs: build
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-artifact
      - name: Upload signed artifact
        uses: actions/upload-artifact@v7
        with:
          name: sb3conv-gui-signed-${{ github.run_id }}
          path: signed-artifact
          if-no-files-found: error
